services:
  redis:
    image: redis:7-alpine
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: urban
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: urban
    ports: ["5432:5432"]
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urban -d urban"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SIMULATION_MODE: pune
      PUNE_DATA_DIR: /app/data/pune
      DATABASE_URL: postgresql+psycopg://urban:urban@db:5432/urban
      BUS: redis
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      VITE_SIMULATION_MODE: pune
      VITE_BASEMAP: carto-light
      API_PROXY_TARGET: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]
